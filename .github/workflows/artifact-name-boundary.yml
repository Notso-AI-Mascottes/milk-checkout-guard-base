name: Raw artifact name boundary probe

on:
  push:
    paths:
      - ".github/workflows/artifact-name-boundary.yml"
      - "scripts/artifact-name-probe.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  produce-raw-artifacts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.probe.outputs.matrix }}
    steps:
      - name: Check out the controlled lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe artifact-service name validation
        id: probe
        run: node scripts/artifact-name-probe.mjs

      - name: Preserve producer results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: artifact-name-producer-evidence-${{ github.run_id }}
          path: artifact-name-probe-results.json

  consume-raw-artifacts:
    needs: produce-raw-artifacts
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        case: ${{ fromJSON(needs.produce-raw-artifacts.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CASE_ID: ${{ matrix.case.id }}
      CASE_NAME_JSON: ${{ toJSON(matrix.case.name) }}
      ARTIFACT_ID: ${{ matrix.case.artifact_id }}
      PROBE_BASE: ${{ github.workspace }}/artifact-name-boundary/${{ matrix.case.id }}
      PROBE_MARKER: ${{ matrix.case.marker }}
    steps:
      - name: Prepare the extraction boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:PROBE_BASE/download" | Out-Null
          Set-Content -NoNewline -LiteralPath "$env:PROBE_BASE/parent-canary.txt" -Value "SAFE-CANARY"

      - name: Download the exact raw artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.case.artifact_id }}
          path: ${{ github.workspace }}/artifact-name-boundary/${{ matrix.case.id }}/download

      - name: Find marker writes outside the requested destination
        if: always()
        shell: pwsh
        run: |
          $download = [IO.Path]::GetFullPath("$env:PROBE_BASE/download")
          $roots = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) |
            Select-Object -Unique
          $matches = @()
          foreach ($root in $roots) {
            Get-ChildItem -Force -File -Recurse -ErrorAction SilentlyContinue -LiteralPath $root |
              ForEach-Object {
                try {
                  if ($_.Length -le 1024 -and (Get-Content -Raw -ErrorAction Stop -LiteralPath $_.FullName) -eq "$env:PROBE_MARKER`n") {
                    $full = [IO.Path]::GetFullPath($_.FullName)
                    $downloadPrefix = $download.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
                    $matches += [ordered]@{
                      path = $full
                      outside_download = -not $full.StartsWith($downloadPrefix, [StringComparison]::OrdinalIgnoreCase)
                    }
                  }
                } catch {}
              }
          }

          $outside = @($matches | Where-Object { $_.outside_download })
          $tree = Get-ChildItem -Force -Recurse -ErrorAction SilentlyContinue -LiteralPath $env:PROBE_BASE |
            ForEach-Object { $_.FullName.Substring($env:PROBE_BASE.Length) }
          $tree | Set-Content -LiteralPath artifact-name-tree.txt

          $result = [ordered]@{
            id = $env:CASE_ID
            artifact_name_json = $env:CASE_NAME_JSON
            artifact_id = $env:ARTIFACT_ID
            os = "${{ matrix.os }}"
            download_outcome = "${{ steps.download.outcome }}"
            marker_matches = $matches
            outside_count = $outside.Count
          }
          $result | ConvertTo-Json -Depth 6 |
            Tee-Object -FilePath artifact-name-result.json
          "OUTSIDE_COUNT=$($outside.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Preserve consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: artifact-name-consumer-${{ matrix.os }}-${{ matrix.case.id }}-${{ github.run_id }}
          path: |
            artifact-name-result.json
            artifact-name-tree.txt

      - name: Fail loudly on an outside write
        if: always()
        shell: pwsh
        run: |
          if ([int]$env:OUTSIDE_COUNT -gt 0) {
            throw "Raw artifact download wrote outside the requested path."
          }
