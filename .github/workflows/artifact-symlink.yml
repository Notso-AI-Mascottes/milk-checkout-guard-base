name: Artifact symlink containment probe

on:
  push:
    paths:
      - ".github/workflows/artifact-symlink.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-job-symlink-primitive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the controlled lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create an outside-root canary and attacker-shaped links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload-root "$RUNNER_TEMP/outside-dir"
          printf 'outside-file-canary:%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/outside-file.txt"
          printf 'outside-directory-canary:%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/outside-dir/nested.txt"
          ln -s "$RUNNER_TEMP/outside-file.txt" upload-root/file-link.txt
          ln -s "$RUNNER_TEMP/outside-dir" upload-root/dir-link
          {
            printf 'declared-root=%s\n' "$GITHUB_WORKSPACE/upload-root"
            printf 'file-link=%s\n' "$(readlink upload-root/file-link.txt)"
            printf 'file-realpath=%s\n' "$(realpath upload-root/file-link.txt)"
            printf 'dir-link=%s\n' "$(readlink upload-root/dir-link)"
            printf 'dir-realpath=%s\n' "$(realpath upload-root/dir-link)"
          } > containment-inputs.txt

      - name: Upload the declared directory as an archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: symlink-archive-${{ github.run_id }}
          path: upload-root/**
          include-hidden-files: true

      - name: Upload the file link without archiving
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ignored-for-direct-upload
          path: upload-root/file-link.txt
          archive: false

      - name: Download the archived probe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: symlink-archive-${{ github.run_id }}
          path: downloaded/archive

      - name: Download the direct-file probe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: file-link.txt
          path: downloaded/direct

      - name: Assert whether content escaped the declared root
        shell: bash
        run: |
          set -euo pipefail
          test -f downloaded/archive/file-link.txt
          test -f downloaded/archive/dir-link/nested.txt
          test -f downloaded/direct/file-link.txt
          cmp "$RUNNER_TEMP/outside-file.txt" downloaded/archive/file-link.txt
          cmp "$RUNNER_TEMP/outside-dir/nested.txt" downloaded/archive/dir-link/nested.txt
          cmp "$RUNNER_TEMP/outside-file.txt" downloaded/direct/file-link.txt
          {
            printf 'archive-file-link-sha256  '
            sha256sum downloaded/archive/file-link.txt | cut -d' ' -f1
            printf 'archive-directory-link-sha256  '
            sha256sum downloaded/archive/dir-link/nested.txt | cut -d' ' -f1
            printf 'direct-file-link-sha256  '
            sha256sum downloaded/direct/file-link.txt | cut -d' ' -f1
          } | tee containment-results.txt

      - name: Preserve machine-readable probe facts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: symlink-containment-evidence-${{ github.run_id }}
          path: |
            containment-inputs.txt
            containment-results.txt

  produce-malicious-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a cross-platform traversal corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile

          cases = {
              "../escape-exact.txt": "CONTROLLED-EXACT-DOT-DOT",
              "nested/../../escape-nested.txt": "CONTROLLED-NESTED-DOT-DOT",
              ".. /escape-space-slash.txt": "CONTROLLED-DOT-DOT-SPACE-SLASH",
              ".. \\escape-space-backslash.txt": "CONTROLLED-DOT-DOT-SPACE-BACKSLASH",
              "nested/.. /../escape-mixed.txt": "CONTROLLED-MIXED-SPACE",
              "/absolute-leading-slash.txt": "CONTROLLED-ABSOLUTE-SLASH",
              "C:\\absolute-drive.txt": "CONTROLLED-ABSOLUTE-DRIVE",
              "..%2f/escape-percent.txt": "CONTROLLED-PERCENT-ENCODED",
              ".../escape-three-dots.txt": "CONTROLLED-THREE-DOTS",
              "safe/control.txt": "CONTROLLED-SAFE-ENTRY",
          }

          with zipfile.ZipFile("boundary-probe.zip", "w", zipfile.ZIP_STORED) as archive:
              for name, content in cases.items():
                  archive.writestr(name, content + "\n")
              archive.writestr("corpus.json", json.dumps(cases, indent=2) + "\n")

          with open("producer-manifest.json", "w", encoding="utf-8") as manifest:
              json.dump({"entries": cases}, manifest, indent=2)
              manifest.write("\n")
          PY
          unzip -Z1 boundary-probe.zip | tee producer-entries.txt
          sha256sum boundary-probe.zip | tee producer-sha256.txt

      - name: Upload the attacker-controlled ZIP without repackaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: this-name-is-ignored-for-direct-upload
          path: boundary-probe.zip
          archive: false

      - name: Preserve producer metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: artifact-boundary-producer-evidence-${{ github.run_id }}
          path: |
            producer-manifest.json
            producer-entries.txt
            producer-sha256.txt

  consume-malicious-archive:
    needs: produce-malicious-archive
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      PROBE_BASE: ${{ github.workspace }}/artifact-boundary-${{ github.run_id }}
    steps:
      - name: Prepare canaries outside the extraction directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:PROBE_BASE/download" | Out-Null
          @(
            "escape-exact.txt",
            "escape-nested.txt",
            "escape-space-slash.txt",
            "escape-space-backslash.txt",
            "escape-mixed.txt",
            "absolute-leading-slash.txt",
            "absolute-drive.txt",
            "escape-percent.txt",
            "escape-three-dots.txt"
          ) | ForEach-Object {
            Set-Content -NoNewline -LiteralPath "$env:PROBE_BASE/$_" -Value "SAFE-CANARY"
          }

      - name: Download and automatically extract the untrusted artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boundary-probe.zip
          path: ${{ github.workspace }}/artifact-boundary-${{ github.run_id }}/download

      - name: Inspect the extraction boundary
        if: always()
        shell: pwsh
        run: |
          $targets = @(
            "escape-exact.txt",
            "escape-nested.txt",
            "escape-space-slash.txt",
            "escape-space-backslash.txt",
            "escape-mixed.txt",
            "absolute-leading-slash.txt",
            "absolute-drive.txt",
            "escape-percent.txt",
            "escape-three-dots.txt"
          )
          $escaped = @()
          $targetFacts = @()
          foreach ($target in $targets) {
            $targetPath = Join-Path $env:PROBE_BASE $target
            $content = Get-Content -Raw -LiteralPath $targetPath
            $didEscape = $content.StartsWith("CONTROLLED-")
            if ($didEscape) {
              $escaped += $target
            }
            $targetFacts += [ordered]@{
              path = $targetPath
              escaped = $didEscape
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $targetPath).Hash.ToLowerInvariant()
            }
          }

          $tree = Get-ChildItem -Force -Recurse -LiteralPath $env:PROBE_BASE |
            ForEach-Object { $_.FullName.Substring($env:PROBE_BASE.Length) }
          $tree | Set-Content -LiteralPath artifact-boundary-tree.txt

          $result = [ordered]@{
            os = "${{ matrix.os }}"
            runner_os = $env:RUNNER_OS
            download_outcome = "${{ steps.download.outcome }}"
            escaped_count = $escaped.Count
            escaped_targets = $escaped
            targets = $targetFacts
          }
          $result | ConvertTo-Json -Depth 5 |
            Tee-Object -FilePath artifact-boundary-results.json
          "ESCAPED_COUNT=$($escaped.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Preserve consumer evidence before the verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: artifact-boundary-consumer-${{ matrix.os }}-${{ github.run_id }}
          path: |
            artifact-boundary-results.json
            artifact-boundary-tree.txt

      - name: Fail loudly if extraction escaped its destination
        if: always()
        shell: pwsh
        run: |
          if ([int]$env:ESCAPED_COUNT -gt 0) {
            throw "Artifact extraction escaped the declared path in $env:ESCAPED_COUNT case(s)."
          }
